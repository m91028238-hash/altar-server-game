<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Altar Server: Prepare for Mass</title>
<style>
html,body{margin:0;height:100%;background:#1a120b;overflow:hidden;font-family:Georgia,serif;color:#f3e3c0;touch-action:none;user-select:none}
canvas{display:block;margin:0 auto;touch-action:none}
</style></head><body><canvas id="c"></canvas>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=720,H=1280;let sc=1;
function resize(){const r=Math.min(innerWidth/W,innerHeight/H);sc=r;cv.width=W*r*devicePixelRatio;cv.height=H*r*devicePixelRatio;cv.style.width=W*r+'px';cv.style.height=H*r+'px';ctx.setTransform(r*devicePixelRatio,0,0,r*devicePixelRatio,0,0);}
addEventListener('resize',resize);resize();
// ----- world (play area y 140..900) -----
const SPOTS={
 altar:{x:360,y:300,w:240,h:90,name:'Altar'},
 credence:{x:600,y:330,w:110,h:60,name:'Credence'},
 ambo:{x:130,y:330,w:80,h:60,name:'Ambo'},
 stand:{x:130,y:560,w:100,h:60,name:'Procession Stand'},
 sacristy:{x:580,y:770,w:220,h:180,name:'Sacristy'}};
const ITEMS=[
 ['Chalice','🏆','credence'],['Paten','🍽️','credence'],['Ciborium','⚱️','credence'],
 ['Purificator','🧻','credence'],['Corporal','⬜','altar'],['Pall','🔳','credence'],
 ['Cruets (water & wine)','🍶','credence'],['Lavabo bowl & towel','🥣','credence'],
 ['Roman Missal','📕','altar'],['Lectionary','📖','ambo'],['Altar candles (light)','🕯️','altar'],
 ['Processional cross','✝️','stand'],['Thurible & incense boat','🏺','stand'],['Altar bells','🔔','credence']];
let S;
function reset(){S={phase:'title',t:120,grace:0,px:360,py:620,tx:null,ty:null,carry:-1,done:ITEMS.map(()=>false),
 floats:[],msg:'',msgT:0,joy:null,keys:{},bell:null,flames:0};}
reset();
function sacSlot(i){return{x:500+(i%5)*40,y:720+Math.floor(i/5)*48};}
function float(x,y,t,c){S.floats.push({x,y,t,c:c||'#ffd76a',a:1.6});}
function say(m){S.msg=m;S.msgT=2.5;}
function inRect(x,y,s,pad=0){return Math.abs(x-s.x)<s.w/2+pad&&Math.abs(y-s.y)<s.h/2+pad;}
// ----- interaction -----
function interact(){
 if(S.carry<0){ if(!inRect(S.px,S.py,SPOTS.sacristy,10))return;
  let best=-1,bd=1e9;ITEMS.forEach((it,i)=>{if(S.done[i])return;const p=sacSlot(i),d=Math.hypot(p.x-S.px,p.y-S.py);if(d<bd){bd=d;best=i;}});
  if(best>=0&&bd<90){S.carry=best;say('Carrying: '+ITEMS[best][0]+' → '+SPOTS[ITEMS[best][2]].name);}
 } else {
  for(const k in SPOTS){if(k==='sacristy')continue;const s=SPOTS[k];
   if(inRect(S.px,S.py,s,45)){
    if(ITEMS[S.carry][2]===k){S.done[S.carry]=true;S.grace+=10;float(s.x,s.y-50,'+10 Grace');
      if(ITEMS[S.carry][0].startsWith('Altar candles'))S.flames=1;
      say(ITEMS[S.carry][0]+' placed ✓');S.carry=-1;
      if(S.done.every(x=>x))startBells();}
    else{float(S.px,S.py-60,'Not here…','#e88');say(ITEMS[S.carry][0]+' belongs at the '+SPOTS[ITEMS[S.carry][2]].name);}
    return;}}
 }}
// ----- bells -----
const CUES=[['Introit: procession enters',0],['Gloria',0],['First Reading',0],['Gospel proclaimed',0],['Homily',0],
 ['Offertory: gifts prepared',0],['Epiclesis: priest extends hands over the gifts',1],['Elevation of the Host',1],
 ['Elevation of the Chalice',1],['Great Amen',0],['Our Father',0],['Sign of Peace',0],['Ite, missa est',0]];
function startBells(){S.phase='bells';S.bell={i:0,t:0,dur:3.2,rung:false,res:[],flash:0,correct:0};say('Mass begins! Ring at the right moments.');}
function ring(){const b=S.bell;if(!b||b.rung)return;b.rung=true;b.flash=0.6;
 if(CUES[b.i][1]){S.grace+=25;b.correct++;float(360,560,'+25 Grace 🔔');}else{S.grace=Math.max(0,S.grace-5);float(360,560,'−5 (not now)','#e88');}}
function advanceCue(){const b=S.bell;if(CUES[b.i][1]&&!b.rung)float(360,560,'Missed the bell','#e88');
 b.i++;b.t=0;b.rung=false;if(b.i>=CUES.length){S.phase='end';}}
function finishTimeout(){S.phase='bells';startBells();say('Time is up — Mass begins anyway!');}
// ----- input -----
const BTN={act:{x:600,y:1010,r:70},ring:{x:360,y:1050,w:340,h:130},play:{x:360,y:860,w:320,h:110}};
function toW(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
cv.addEventListener('pointerdown',e=>{const p=toW(e);cv.setPointerCapture(e.pointerId);press(p.x,p.y,e.pointerId);});
cv.addEventListener('pointermove',e=>{if(S.joy&&S.joy.id===e.pointerId){const p=toW(e);S.joy.x=p.x;S.joy.y=p.y;}});
cv.addEventListener('pointerup',e=>{if(S.joy&&S.joy.id===e.pointerId)S.joy=null;});
function press(x,y,id){
 if(S.phase==='title'||S.phase==='end'){if(Math.abs(x-360)<160&&Math.abs(y-860)<55){reset();S.phase='prep';}return;}
 if(S.phase==='bells'){if(Math.abs(x-360)<170&&Math.abs(y-1050)<65)ring();return;}
 if(Math.hypot(x-BTN.act.x,y-BTN.act.y)<BTN.act.r){interact();return;}
 if(y>940){S.joy={id,ox:x,oy:y,x,y};S.tx=null;return;}
 if(y>130&&y<930){S.tx=x;S.ty=y;}
}
addEventListener('keydown',e=>{S.keys[e.key]=1;if(e.key===' '||e.key==='Enter'){e.preventDefault();
 if(S.phase==='prep')interact();else if(S.phase==='bells')ring();else{reset();S.phase='prep';}}});
addEventListener('keyup',e=>{S.keys[e.key]=0;});
// ----- update -----
function update(dt){
 S.floats.forEach(f=>{f.y-=40*dt;f.a-=dt;});S.floats=S.floats.filter(f=>f.a>0);
 if(S.msgT>0)S.msgT-=dt;
 if(S.phase==='prep'){S.t-=dt;if(S.t<=0){S.t=0;finishTimeout();return;}
  let vx=0,vy=0,sp=300;const k=S.keys;
  if(k.ArrowLeft||k.a)vx--;if(k.ArrowRight||k.d)vx++;if(k.ArrowUp||k.w)vy--;if(k.ArrowDown||k.s)vy++;
  if(S.joy){const dx=S.joy.x-S.joy.ox,dy=S.joy.y-S.joy.oy,m=Math.hypot(dx,dy);if(m>8){vx=dx/Math.max(m,60);vy=dy/Math.max(m,60);}}
  if(vx||vy){S.tx=null;const m=Math.max(1,Math.hypot(vx,vy));S.px+=vx/m*sp*dt;S.py+=vy/m*sp*dt;}
  else if(S.tx!=null){const dx=S.tx-S.px,dy=S.ty-S.py,d=Math.hypot(dx,dy);if(d<6){S.tx=null;autoAct();}else{const s=Math.min(d,sp*dt);S.px+=dx/d*s;S.py+=dy/d*s;}}
  S.px=Math.max(40,Math.min(680,S.px));S.py=Math.max(200,Math.min(900,S.py));
  // altar collision
  const a=SPOTS.altar;if(inRect(S.px,S.py,a,20)){S.py=a.y+a.h/2+21;}
 }
 if(S.phase==='bells'){const b=S.bell;b.t+=dt;b.flash=Math.max(0,b.flash-dt);if(b.t>=b.dur)advanceCue();}
}
function autoAct(){ // tap-to-move: arriving at a station auto-interacts
 if(S.carry<0&&inRect(S.px,S.py,SPOTS.sacristy,10))interact();
 else if(S.carry>=0)for(const k in SPOTS)if(k!=='sacristy'&&inRect(S.px,S.py,SPOTS[k],45)){interact();break;}}
// ----- drawing -----
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(t,x,y,sz,c,al){ctx.font=sz+'px Georgia,serif';ctx.fillStyle=c||'#f3e3c0';ctx.textAlign=al||'center';ctx.fillText(t,x,y);}
function emo(e,x,y,s){ctx.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y);ctx.textBaseline='alphabetic';}
let floorPat=null;
function church(time){
 // floor
 const g=ctx.createLinearGradient(0,130,0,940);g.addColorStop(0,'#3b2a1a');g.addColorStop(1,'#20160d');ctx.fillStyle=g;ctx.fillRect(0,130,W,810);
 for(let y=200;y<940;y+=50)for(let x=0;x<W;x+=50){ctx.fillStyle=((x+y)/50)%2?'rgba(214,190,150,.10)':'rgba(120,95,60,.10)';ctx.fillRect(x+1,y+1,48,48);}
 // sanctuary step & carpet
 ctx.fillStyle='#5a4128';ctx.fillRect(0,200,W,260);ctx.fillStyle='rgba(255,215,140,.06)';ctx.fillRect(0,455,W,8);
 ctx.fillStyle='#7a1f1f';ctx.fillRect(310,460,100,480);ctx.strokeStyle='#d8b25a';ctx.lineWidth=3;ctx.strokeRect(314,460,92,480);
 // apse wall with gothic windows
 const wg=ctx.createLinearGradient(0,130,0,205);wg.addColorStop(0,'#6b5a45');wg.addColorStop(1,'#4a3c2c');ctx.fillStyle=wg;ctx.fillRect(0,130,W,72);
 for(let i=0;i<6;i++){const x=60+i*120;ctx.fillStyle='#2a1d12';ctx.beginPath();ctx.moveTo(x-28,200);ctx.lineTo(x-28,160);ctx.quadraticCurveTo(x,120,x+28,160);ctx.lineTo(x+28,200);ctx.fill();
  const cols=['#c0392b','#2e5fa8','#e0b040','#3f8f4f'];for(let j=0;j<4;j++){ctx.fillStyle=cols[(i+j)%4];ctx.globalAlpha=.75+.15*Math.sin(time*1.3+i+j);ctx.fillRect(x-22+j*11,165,10,32);}ctx.globalAlpha=1;
  // light shafts
  ctx.fillStyle='rgba(255,220,150,.045)';ctx.beginPath();ctx.moveTo(x-25,200);ctx.lineTo(x+25,200);ctx.lineTo(x+80,600);ctx.lineTo(x+10,600);ctx.fill();}
 // pillars
 for(const [x,y] of [[40,480],[680,480],[40,700],[40,900],[680,640]]){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+6,y+8,30,16,0,0,7);ctx.fill();
  const pg=ctx.createRadialGradient(x-8,y-8,4,x,y,28);pg.addColorStop(0,'#b8a585');pg.addColorStop(1,'#5d4e3a');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();}
 // pews
 for(let r=0;r<4;r++){for(const x of [180,540]){ctx.fillStyle='#4a2e18';rr(x-110,520+r*95,200,34,6);ctx.fill();ctx.fillStyle='#6b4426';rr(x-110,520+r*95,200,12,6);ctx.fill();}}
 // stations
 for(const k in SPOTS){const s=SPOTS[k];
  if(k==='sacristy'){ctx.fillStyle='#2c2016';rr(s.x-s.w/2,s.y-s.h/2,s.w,s.h,10);ctx.fill();ctx.strokeStyle='#c9a24d';ctx.lineWidth=3;ctx.stroke();
   txt('SACRISTY',s.x,s.y-s.h/2+24,20,'#e8c873');
   ctx.fillStyle='#5b3a1e';ctx.fillRect(s.x-s.w/2+12,s.y-58,s.w-24,140);continue;}
  ctx.fillStyle='rgba(0,0,0,.35)';rr(s.x-s.w/2+6,s.y-s.h/2+8,s.w,s.h,8);ctx.fill();
  if(k==='altar'){const ag=ctx.createLinearGradient(0,s.y-s.h/2,0,s.y+s.h/2);ag.addColorStop(0,'#efe6d2');ag.addColorStop(1,'#c9b896');ctx.fillStyle=ag;}else ctx.fillStyle=k==='credence'?'#8b6a44':'#7a5a3a';
  rr(s.x-s.w/2,s.y-s.h/2,s.w,s.h,8);ctx.fill();ctx.strokeStyle='#d8b25a';ctx.lineWidth=3;ctx.stroke();
  if(k==='altar'){ctx.fillStyle='#d8b25a';ctx.fillRect(s.x-s.w/2,s.y+s.h/2-14,s.w,6);emo('✠',s.x,s.y+10,26);}
  txt(s.name,s.x,s.y+s.h/2+22,17,'#e8c873');
  // placed items
  let n=0;ITEMS.forEach((it,i)=>{if(S.done[i]&&it[2]===k){const cols=k==='altar'?6:4;emo(it[1],s.x-s.w/2+20+(n%cols)*((s.w-30)/(cols-1||1)),s.y-s.h/2+18+Math.floor(n/cols)*26,22);n++;}});
 }
 // candles flames
 if(S.flames){for(const dx of [-100,100]){const x=SPOTS.altar.x+dx,y=SPOTS.altar.y-30;const fg=ctx.createRadialGradient(x,y,1,x,y,60);fg.addColorStop(0,'rgba(255,210,120,.55)');fg.addColorStop(1,'rgba(255,180,80,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(x,y,60,0,7);ctx.fill();
  ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.ellipse(x,y+Math.sin(time*9)*1.5,5,9,0,0,7);ctx.fill();}}
 // sacristy items
 ITEMS.forEach((it,i)=>{if(S.done[i]||S.carry===i)return;const p=sacSlot(i);ctx.fillStyle='rgba(255,220,140,.12)';ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();emo(it[1],p.x,p.y,26);});
 // target hint
 if(S.carry>=0){const s=SPOTS[ITEMS[S.carry][2]];ctx.strokeStyle='rgba(255,215,106,'+(.5+.4*Math.sin(time*5))+')';ctx.lineWidth=4;ctx.setLineDash([10,8]);rr(s.x-s.w/2-12,s.y-s.h/2-12,s.w+24,s.h+24,12);ctx.stroke();ctx.setLineDash([]);}
 else{const s=SPOTS.sacristy;ctx.strokeStyle='rgba(255,215,106,'+(.3+.3*Math.sin(time*4))+')';ctx.lineWidth=3;rr(s.x-s.w/2-6,s.y-s.h/2-6,s.w+12,s.h+12,14);ctx.stroke();}
 if(S.tx!=null){ctx.strokeStyle='rgba(255,215,106,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(S.tx,S.ty,14+4*Math.sin(time*8),0,7);ctx.stroke();}
 // player: altar server, cassock + white alb (top-down-ish)
 const x=S.px,y=S.py,bob=Math.sin(time*10)*((S.tx!=null||S.joy)?2:0);
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+30,26,10,0,0,7);ctx.fill();
 ctx.fillStyle='#1d1d2a';ctx.beginPath();ctx.moveTo(x-22,y+28);ctx.lineTo(x+22,y+28);ctx.lineTo(x+14,y-6);ctx.lineTo(x-14,y-6);ctx.fill(); // cassock hem
 ctx.fillStyle='#f6f1e6';ctx.beginPath();ctx.moveTo(x-20,y+18+bob);ctx.lineTo(x+20,y+18+bob);ctx.lineTo(x+13,y-14);ctx.lineTo(x-13,y-14);ctx.fill(); // alb
 ctx.strokeStyle='#d6cbb3';ctx.lineWidth=1.5;for(const d of [-8,0,8]){ctx.beginPath();ctx.moveTo(x+d*.6,y-10);ctx.lineTo(x+d,y+16+bob);ctx.stroke();}
 ctx.fillStyle='#c9a24d';ctx.fillRect(x-13,y-2,26,3); // cincture
 ctx.fillStyle='#f6f1e6';ctx.beginPath();ctx.ellipse(x-17,y-4,7,12,.3,0,7);ctx.ellipse(x+17,y-4,7,12,-.3,0,7);ctx.fill();
 ctx.fillStyle='#e8bf98';ctx.beginPath();ctx.arc(x,y-26,13,0,7);ctx.fill();ctx.fillStyle='#4a2e18';ctx.beginPath();ctx.arc(x,y-30,13,Math.PI*1.05,Math.PI*1.95);ctx.fill();
 if(S.carry>=0){ctx.fillStyle='rgba(255,220,140,.25)';ctx.beginPath();ctx.arc(x,y-60,22,0,7);ctx.fill();emo(ITEMS[S.carry][1],x,y-60,30);}
}
function bar(x,y,w,h,f,c){ctx.fillStyle='rgba(0,0,0,.5)';rr(x,y,w,h,h/2);ctx.fill();const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#b8862b');g.addColorStop(1,c||'#ffe08a');ctx.fillStyle=g;rr(x,y,Math.max(h,w*Math.min(1,f)),h,h/2);ctx.fill();ctx.strokeStyle='#d8b25a';ctx.lineWidth=2;rr(x,y,w,h,h/2);ctx.stroke();}
function hud(){
 const g=ctx.createLinearGradient(0,0,0,130);g.addColorStop(0,'#2a1c10');g.addColorStop(1,'#1a120b');ctx.fillStyle=g;ctx.fillRect(0,0,W,130);ctx.fillStyle='#c9a24d';ctx.fillRect(0,128,W,3);
 txt('✠ Prepare for Mass',24,44,30,'#ffe08a','left');
 const m=Math.floor(S.t/60),s=Math.floor(S.t%60);txt('⏳ '+m+':'+String(s).padStart(2,'0'),W-24,44,30,S.t<20?'#ff9a8a':'#ffe08a','right');
 txt('Grace '+S.grace,24,96,22,'#f3e3c0','left');bar(160,78,W-190,24,S.grace/(ITEMS.length*10+75));
}
function checklist(){
 ctx.fillStyle='#1d140c';ctx.fillRect(0,940,W,340);ctx.fillStyle='#c9a24d';ctx.fillRect(0,940,W,3);
 ctx.font='17px Georgia,serif';
 ITEMS.forEach((it,i)=>{const col=i%2,row=Math.floor(i/2),x=20+col*240,y=972+row*26;
  ctx.textAlign='left';ctx.fillStyle=S.done[i]?'#9fd28a':(S.carry===i?'#ffe08a':'#bfae8c');ctx.fillText((S.done[i]?'✔ ':'☐ ')+it[0],x,y);});
 // action button
 const b=BTN.act;const rg=ctx.createRadialGradient(b.x-15,b.y-15,5,b.x,b.y,b.r);rg.addColorStop(0,'#ffe9a8');rg.addColorStop(1,'#b8862b');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(b.x,b.y+40,b.r-10,0,7);ctx.fill();
 txt(S.carry>=0?'PLACE':'PICK UP',b.x,b.y+47,20,'#2a1c10');
 txt('Tap floor to walk · drag low area = joystick · arrows/WASD + Space',360,1262,16,'#8f7d5c');
 if(S.joy){ctx.strokeStyle='rgba(255,224,138,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(S.joy.ox,S.joy.oy,60,0,7);ctx.stroke();ctx.fillStyle='rgba(255,224,138,.5)';const dx=S.joy.x-S.joy.ox,dy=S.joy.y-S.joy.oy,m=Math.min(60,Math.hypot(dx,dy))/(Math.hypot(dx,dy)||1);ctx.beginPath();ctx.arc(S.joy.ox+dx*m,S.joy.oy+dy*m,26,0,7);ctx.fill();}
}
function floats(){S.floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.a);ctx.font='bold 28px Georgia,serif';ctx.lineWidth=4;ctx.strokeStyle='#2a1c10';ctx.textAlign='center';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);});ctx.globalAlpha=1;
 if(S.msgT>0){ctx.globalAlpha=Math.min(1,S.msgT);ctx.fillStyle='rgba(20,12,6,.85)';rr(60,150,600,46,23);ctx.fill();txt(S.msg,360,181,20,'#ffe08a');ctx.globalAlpha=1;}}
function button(b,label){const g=ctx.createLinearGradient(0,b.y-b.h/2,0,b.y+b.h/2);g.addColorStop(0,'#ffe08a');g.addColorStop(1,'#b8862b');ctx.fillStyle=g;rr(b.x-b.w/2,b.y-b.h/2,b.w,b.h,24);ctx.fill();ctx.strokeStyle='#fff3c8';ctx.lineWidth=3;ctx.stroke();txt(label,b.x,b.y+12,36,'#2a1c10');}
function overlay(time,title,lines){church(time);ctx.fillStyle='rgba(15,9,4,.78)';ctx.fillRect(0,0,W,H);
 emo('✠',360,260,90);txt(title,360,390,46,'#ffe08a');lines.forEach((l,i)=>txt(l,360,460+i*40,24,'#f3e3c0'));}
function bells(time){church(time);hud();ctx.fillStyle='rgba(15,9,4,.72)';ctx.fillRect(0,130,W,H);
 const b=S.bell;txt('Holy Mass — ring the bells',360,250,32,'#ffe08a');
 if(b.i<CUES.length){const c=CUES[b.i];ctx.fillStyle='rgba(60,40,20,.9)';rr(50,360,620,170,20);ctx.fill();ctx.strokeStyle='#c9a24d';ctx.lineWidth=3;ctx.stroke();
  ctx.font='28px Georgia,serif';ctx.fillStyle='#f3e3c0';ctx.textAlign='center';const words=c[0].split(' ');let line='',ly=430;
  for(const w of words){if(ctx.measureText(line+w).width>560){ctx.fillText(line,360,ly);line='';ly+=38;}line+=w+' ';}ctx.fillText(line,360,ly);
  bar(80,500,560,14,1-b.t/b.dur);txt('Moment '+(b.i+1)+' / '+CUES.length,360,620,20,'#bfae8c');}
 txt('Grace '+S.grace,360,700,30,'#ffe08a');
 if(b.flash>0){ctx.fillStyle='rgba(255,220,140,'+b.flash*.5+')';ctx.beginPath();ctx.arc(360,1050,120+b.flash*80,0,7);ctx.fill();}
 button(BTN.ring,'🔔 RING BELL');floats();}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;update(dt);ctx.clearRect(0,0,W,H);
 if(S.phase==='title'){overlay(time,'Altar Server',['Level 1: Prepare for Mass','Carry each sacred item from the sacristy','to its place before Mass begins (2:00).','Then ring the bells at the right moments.']);button(BTN.play,'Begin');}
 else if(S.phase==='prep'){church(time);hud();checklist();floats();}
 else if(S.phase==='bells')bells(time);
